<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גלובוס ממדי ההתמדה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Assistant:wght@600;700&display=swap">
<style>
/* Layout: one full-screen WebGL scene — dotted globe, three thick cards orbiting on a tilted ring, title overlaid on top, controls along the bottom. Single deep-night look by choice. */
:root {
  --bg-1: #1d1530;
  --bg-2: #0c0914;
  --fg: #f4f0f8;
  --muted: rgba(244, 240, 248, .62);
  --chip: rgba(255, 255, 255, .08);
  --chip-border: rgba(255, 255, 255, .18);
  --pink: #c21e6a;
  --orange: #eba322;
  --teal: #6bb89b;
  --font-display: "Rubik", "Assistant", "Segoe UI", Arial, sans-serif;
  --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; direction: rtl; color: var(--fg); font-family: var(--font-body);
  background: radial-gradient(120% 90% at 50% 45%, var(--bg-1) 0%, var(--bg-2) 70%) var(--bg-2);
}
.app { position: relative; height: 100%; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
#scene.drag { cursor: grabbing; }
#scene.hover { cursor: pointer; }
.top, .bottom {
  position: absolute; left: 0; right: 0; pointer-events: none; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { top: 0; padding-block: 26px 0; }
.bottom { bottom: 0; padding-block: 0 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em;
  font-size: clamp(28px, 5.4vw, 58px); text-wrap: balance;
  text-shadow: 0 4px 30px rgba(194, 30, 106, .35);
}
.controls { pointer-events: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.controls button {
  font: 600 15px var(--font-body); color: var(--fg); background: var(--chip); border: 1px solid var(--chip-border);
  border-radius: 999px; padding: 8px 16px; cursor: pointer; backdrop-filter: blur(6px);
}
.controls button:hover { background: rgba(255, 255, 255, .16); }
.controls button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.dots { display: flex; gap: 10px; }
.dots button { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 2px solid var(--dc); background: transparent; transition: background .3s, transform .3s; }
.dots button[aria-current="true"] { background: var(--dc); transform: scale(1.2); }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="app">
  <canvas id="scene" tabindex="0" aria-label="גלובוס תלת־ממדי של שלושת הממדים. חצים לסיבוב, Enter להיפוך כרטיס"></canvas>
  <div class="top"><h1>ממדים קריטיים להתמדה</h1></div>
  <div class="bottom">
    <div class="controls">
      <button id="prev" type="button" aria-label="הקודם">→</button>
      <div class="dots" id="dots"></div>
      <button id="next" type="button" aria-label="הבא">←</button>
      <button id="play" type="button">השהיה</button>
    </div>
    <p class="hint">גררו לסיבוב · לחצו על כרטיס כדי להפוך אותו</p>
  </div>
  <div class="sr" id="sr"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async () => {
  const DATA = [
    { name: 'מעורבות', color: '#6bb89b', front: ['מי מתנתק מהקבוצה?', 'מי כבר לא כאן?'], back: ['סטטוס צפייה במפגשי הנחייה', 'סטודנטים שלא נכנסו חודש'] },
    { name: 'התקדמות', color: '#eba322', front: ['מי נשאר מאחור בחומר', 'ועד כמה?'], back: ['סטטוס השלמת', 'יחידות לימוד'] },
    { name: 'ביצוע', color: '#c21e6a', front: ['מי מתחיל ״להחליק״', 'בהגשת מטלות?'], back: ['סטטוס הגשת מטלות'] },
  ];

  // text for screen readers
  document.getElementById('sr').innerHTML = DATA.map(d =>
    `<h2>${d.name}</h2><p>${d.front.join(' ')}</p><p>${d.back.join(' ')}</p>`).join('');

  if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<div class="fallback">לא ניתן לטעון את התצוגה התלת־ממדית בדפדפן הזה.</div>'); return; }

  const canvas = document.getElementById('scene');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
  catch (e) { document.body.insertAdjacentHTML('beforeend', '<div class="fallback">הדפדפן לא תומך ב־WebGL, ולכן התצוגה התלת־ממדית לא זמינה.</div>'); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

  await Promise.race([
    Promise.all(['800 96px Rubik', '600 66px Assistant', '700 68px Assistant'].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 2500)),
  ]).catch(() => {});

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scene = new THREE.Scene();
  const FOG = new THREE.Color('#150f22');
  scene.fog = new THREE.Fog(FOG, 8, 18);
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
  const TILT = 0.2, GR = 1.55, CW = 2.6, CH = 1.62, CD = 0.08;
  let R = 3.5, dist = 9;

  // ---------- helpers ----------
  function shade(hex, p) {
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
    const t = p < 0 ? 0 : 255, a = Math.abs(p);
    r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
    return `rgb(${r},${g},${b})`;
  }
  function radialTex(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(([o, col]) => gr.addColorStop(o, col));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const dotTex = radialTex([[0, 'rgba(255,255,255,1)'], [.3, 'rgba(255,255,255,.95)'], [.5, 'rgba(255,255,255,.25)'], [1, 'rgba(255,255,255,0)']]);
  const softTex = radialTex([[0, 'rgba(255,255,255,.85)'], [.22, 'rgba(255,255,255,.35)'], [.6, 'rgba(255,255,255,.06)'], [1, 'rgba(255,255,255,0)']]);

  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
  }
  function chevron(g, cx, cy, w) {
    const P = [[-.5, -.3], [0, .04], [.5, -.3], [.5, -.02], [0, .32], [-.5, -.02]];
    g.beginPath(); P.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](cx + x * w, cy + y * w)); g.closePath(); g.fill();
  }
  function fitFont(g, lines, weight, size, family, maxW) {
    let s = size;
    while (s > 30) { g.font = `${weight} ${s}px ${family}`; if (Math.max(...lines.map(l => g.measureText(l).width)) <= maxW) break; s -= 2; }
    return s;
  }
  function cardTexture(d, side) {
    const W = 1024, H = Math.round(1024 * CH / CW), RAD = 36;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    rr(g, 0, 0, W, H, RAD);
    const gr = g.createLinearGradient(0, 0, W, H);
    gr.addColorStop(0, shade(d.color, .12)); gr.addColorStop(1, shade(d.color, -.2));
    g.fillStyle = gr; g.fill();
    g.save(); g.clip();
    const sh = g.createLinearGradient(0, 0, W * .55, H);
    sh.addColorStop(0, 'rgba(255,255,255,.24)'); sh.addColorStop(.5, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,.08)'; chevron(g, 120, H - 90, 300);
    g.restore();
    rr(g, 16, 16, W - 32, H - 32, RAD - 14); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.stroke();
    // folded-corner motif from the slide
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.beginPath(); g.moveTo(46, 46); g.lineTo(156, 46); g.lineTo(156, 76); g.lineTo(76, 76); g.lineTo(76, 156); g.lineTo(46, 156); g.closePath(); g.fill();

    g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 10; g.shadowOffsetY = 3;
    const maxW = W - 180;
    if (side === 'front') {
      g.font = '800 98px Rubik, Assistant, sans-serif'; g.fillText(d.name, W / 2, 175);
      g.shadowColor = 'transparent'; g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(W / 2 - 60, 248, 120, 6);
      g.shadowColor = 'rgba(0,0,0,.28)'; g.fillStyle = '#fff';
      const s = fitFont(g, d.front, 600, 66, 'Assistant, sans-serif', maxW), lh = s * 1.35;
      const y0 = 420 - (d.front.length - 1) * lh / 2;
      d.front.forEach((l, i) => g.fillText(l, W / 2, y0 + i * lh));
    } else {
      g.shadowColor = 'transparent'; g.fillStyle = 'rgba(255,255,255,.75)'; chevron(g, W / 2, 150, 92);
      g.shadowColor = 'rgba(0,0,0,.28)'; g.fillStyle = '#fff';
      const s = fitFont(g, d.back, 700, 70, 'Assistant, sans-serif', maxW), lh = s * 1.4;
      const y0 = 380 - (d.back.length - 1) * lh / 2;
      d.back.forEach((l, i) => g.fillText(l, W / 2, y0 + i * lh));
    }
    const t = new THREE.CanvasTexture(cv);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function ringPos(phi, r, out = new THREE.Vector3()) {
    const z0 = r * Math.cos(phi);
    return out.set(r * Math.sin(phi), -z0 * Math.sin(TILT), z0 * Math.cos(TILT));
  }

  // ---------- stars ----------
  {
    const n = 1400, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const v = new THREE.Vector3().randomDirection ? new THREE.Vector3().randomDirection() : new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
      v.multiplyScalar(30 + Math.random() * 30); p.set([v.x, v.y, v.z], i * 3);
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
    var stars = new THREE.Points(geo, new THREE.PointsMaterial({ size: .18, map: dotTex, transparent: true, opacity: .55, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
    scene.add(stars);
  }

  // ---------- globe ----------
  const globe = new THREE.Group(); scene.add(globe);
  globe.add(new THREE.Mesh(new THREE.SphereGeometry(GR * .97, 48, 48), new THREE.MeshBasicMaterial({ color: '#1a1330' })));
  {
    const n = 2600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    const pal = DATA.map(d => new THREE.Color(d.color)), white = new THREE.Color('#ffffff');
    for (let i = 0; i < n; i++) {
      const y = 1 - 2 * (i + .5) / n, r = Math.sqrt(1 - y * y), th = i * 2.399963;
      const x = Math.cos(th) * r, z = Math.sin(th) * r;
      pos.set([x * GR, y * GR, z * GR], i * 3);
      const f = Math.sin(x * 3.1 + y * 2.2) * Math.cos(z * 2.6 - y * 1.8) + Math.sin(y * 5) * .25;
      const c = pal[f > .22 ? 0 : f < -.22 ? 2 : 1].clone().lerp(white, .12).multiplyScalar(.55 + Math.random() * .5);
      col.set([c.r, c.g, c.b], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    globe.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: .075, map: dotTex, vertexColors: true, transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending })));
    const lineMat = new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: .07, fog: false, blending: THREE.AdditiveBlending });
    const circle = (r, y) => { const pts = []; for (let i = 0; i <= 96; i++) { const a = i / 96 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r)); } return new THREE.BufferGeometry().setFromPoints(pts); };
    [-.6, 0, .6].forEach(t => globe.add(new THREE.Line(circle(GR * 1.005 * Math.sqrt(1 - t * t), GR * t), lineMat)));
    for (let k = 0; k < 4; k++) { const m = new THREE.Line(circle(GR * 1.005, 0), lineMat), w = new THREE.Group(); m.rotation.x = Math.PI / 2; w.rotation.y = k * Math.PI / 4; w.add(m); globe.add(w); }
  }
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: '#b06bd6', transparent: true, opacity: .5, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
  halo.scale.setScalar(GR * 4.2); scene.add(halo);

  // ---------- orbit path ----------
  const ringGeo = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 161 }, (_, i) => ringPos(i / 160 * Math.PI * 2, 1)));
  const ring = new THREE.Line(ringGeo, new THREE.LineDashedMaterial({ color: '#ffffff', dashSize: .025, gapSize: .02, transparent: true, opacity: .22 }));
  ring.computeLineDistances(); scene.add(ring);

  // ---------- cards ----------
  const shape = (() => {
    const s = new THREE.Shape(), x = -CW / 2, y = -CH / 2, r = .09, w = CW, h = CH;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
    s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
  })();
  const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: CD, bevelEnabled: false, curveSegments: 8 }); bodyGeo.translate(0, 0, -CD / 2);
  const planeGeo = new THREE.PlaneGeometry(CW, CH);
  const pickables = [];
  const cards = DATA.map((d, idx) => {
    const group = new THREE.Group(), tilt = new THREE.Group(), pivot = new THREE.Group();
    group.add(tilt); tilt.add(pivot); scene.add(group);
    const bodyMat = new THREE.MeshBasicMaterial({ color: shade(d.color, -.4) });
    const frontMat = new THREE.MeshBasicMaterial({ map: cardTexture(d, 'front'), transparent: true, alphaTest: .02 });
    const backMat = new THREE.MeshBasicMaterial({ map: cardTexture(d, 'back'), transparent: true, alphaTest: .02 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    const front = new THREE.Mesh(planeGeo, frontMat); front.position.z = CD / 2 + .003;
    const back = new THREE.Mesh(planeGeo, backMat); back.position.z = -CD / 2 - .003; back.rotation.y = Math.PI;
    pivot.add(body, front, back);
    [body, front, back].forEach(m => { m.userData.idx = idx; pickables.push(m); });
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: d.color, transparent: true, opacity: 0, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
    glow.position.z = -.4; glow.scale.set(CW * 2.3, CH * 2.6, 1); group.add(glow);
    // beam from the globe to the card, with a travelling spark
    const beamPos = new Float32Array(48 * 3), beamGeo = new THREE.BufferGeometry();
    beamGeo.setAttribute('position', new THREE.BufferAttribute(beamPos, 3));
    const beam = new THREE.Line(beamGeo, new THREE.LineBasicMaterial({ color: d.color, transparent: true, opacity: .5, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
    beam.frustumCulled = false; scene.add(beam);
    const spark = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: d.color, transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
    spark.scale.setScalar(.22); scene.add(spark);
    return { d, idx, group, tilt, pivot, bodyMat, frontMat, backMat, glow, beam, beamPos, spark, flip: 0, flipTarget: 0, hover: 0, pos: new THREE.Vector3(), k: 0 };
  });

  // ---------- dots / controls ----------
  const dots = document.getElementById('dots');
  DATA.forEach((d, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.style.setProperty('--dc', d.color);
    b.setAttribute('aria-label', d.name); b.onclick = () => { userTouched(); goTo(i); };
    dots.appendChild(b);
  });

  // ---------- state ----------
  const STEP = Math.PI * 2 / DATA.length;
  let angle = 0, target = null, vel = 0, dragging = false, auto = !reduce, resumeAt = 0;
  let phase = 'travel', phaseT = 0, introT = reduce ? 1 : 0, time = 0;
  const mouse = new THREE.Vector2(), mouseS = new THREE.Vector2();

  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  function frontIndex() { let best = 0, bz = -2; cards.forEach((c, i) => { const z = Math.cos(angle + i * STEP); if (z > bz) { bz = z; best = i; } }); return best; }
  function goTo(i) { target = angle + wrap(-(angle + i * STEP)); vel = 0; cards.forEach(c => c.flipTarget = 0); phase = 'travel'; phaseT = 0; }
  function userTouched() { resumeAt = time + 7; phase = 'travel'; phaseT = 0; }
  function toggleFlip(i) { cards[i].flipTarget = cards[i].flipTarget ? 0 : 1; }

  const playBtn = document.getElementById('play');
  const setAuto = v => { auto = v; playBtn.textContent = v ? 'השהיה' : 'הפעלה'; };
  setAuto(auto);
  playBtn.onclick = () => setAuto(!auto);
  document.getElementById('next').onclick = () => { userTouched(); goTo((frontIndex() + 1) % DATA.length); };
  document.getElementById('prev').onclick = () => { userTouched(); goTo((frontIndex() + DATA.length - 1) % DATA.length); };
  canvas.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { userTouched(); goTo((frontIndex() + 1) % DATA.length); }
    else if (e.key === 'ArrowRight') { userTouched(); goTo((frontIndex() + DATA.length - 1) % DATA.length); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userTouched(); toggleFlip(frontIndex()); }
  });

  // ---------- picking & dragging ----------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(x, y) {
    const r = canvas.getBoundingClientRect();
    ndc.set((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object.userData.idx : -1;
  }
  let lastX = 0, moved = 0, hovered = -1;
  canvas.addEventListener('pointerdown', e => { dragging = true; moved = 0; lastX = e.clientX; vel = 0; target = null; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.set((e.clientX - r.left) / r.width * 2 - 1, (e.clientY - r.top) / r.height * 2 - 1);
    if (dragging) {
      const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
      const s = 0.0075 * (camera.aspect < .9 ? 1.5 : 1);
      angle += dx * s; vel = dx * s;
      if (moved > 6) userTouched();
    } else {
      hovered = pick(e.clientX, e.clientY);
      canvas.classList.toggle('hover', hovered >= 0);
    }
  });
  canvas.addEventListener('pointerleave', () => { hovered = -1; mouse.set(0, 0); canvas.classList.remove('hover'); });
  canvas.addEventListener('pointerup', e => {
    if (!dragging) return; dragging = false; canvas.classList.remove('drag');
    if (moved < 6) {
      const i = pick(e.clientX, e.clientY);
      if (i >= 0) { userTouched(); i === frontIndex() ? toggleFlip(i) : goTo(i); }
    } else if (Math.abs(vel) < .002) goTo(frontIndex());
  });

  // ---------- sizing ----------
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const portrait = camera.aspect < .9;
    R = portrait ? 2.4 : 3.5;
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    dist = Math.max(9.2, ((portrait ? R * .55 : R * .9) + CW * .6) / (t * camera.aspect));
    camera.updateProjectionMatrix();
    ring.scale.setScalar(R);
    scene.fog.near = dist - R * .4; scene.fog.far = dist + R * 2.2;
  }
  addEventListener('resize', resize); resize();

  // ---------- loop ----------
  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  const tmp = new THREE.Vector3(), a = new THREE.Vector3(), m = new THREE.Vector3();
  const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3());
  let prev = performance.now();

  function frame(now) {
    const dt = Math.min((now - prev) / 1000, .05); prev = now; time += dt;
    if (introT < 1) introT = Math.min(1, introT + dt / 2.4);

    // carousel motion
    if (target !== null) {
      const d = target - angle; angle += d * (1 - Math.exp(-dt * (reduce ? 30 : 3.4)));
      if (Math.abs(d) < .001) { angle = target; target = null; }
    } else if (!dragging && Math.abs(vel) > 1e-4) {
      angle += vel; vel *= Math.pow(.92, dt * 60);
      if (Math.abs(vel) <= 1e-4) goTo(frontIndex());
    }

    // guided presentation: bring a card forward, show its question, flip to its status, move on
    const fi = frontIndex();
    if (auto && !dragging && time > resumeAt && introT >= 1) {
      phaseT += dt;
      if (phase === 'travel' && target === null && Math.abs(vel) < 1e-4) { phase = 'q'; phaseT = 0; }
      else if (phase === 'q' && phaseT > 2) { cards[fi].flipTarget = 1; phase = 's'; phaseT = 0; }
      else if (phase === 's' && phaseT > 3.8) { goTo((fi + 1) % DATA.length); }
    }
    [...dots.children].forEach((b, i) => b.setAttribute('aria-current', i === fi));

    // camera with gentle parallax and intro dolly
    mouseS.lerp(mouse, 1 - Math.exp(-dt * 3));
    const ci = ease(introT);
    camera.position.set(mouseS.x * .7, 1.25 - mouseS.y * .35, dist * (1 + (1 - ci) * .7));
    camera.lookAt(0, -.15, 0);

    globe.rotation.y += dt * .12; globe.rotation.x = .25;
    stars.rotation.y += dt * .006;
    halo.material.opacity = .42 + Math.sin(time * 1.3) * .06;

    cards.forEach((c, i) => {
      const phi = angle + i * STEP;
      const e = ease((introT - .1 - i * .12) / .75);
      ringPos(phi, R * e, c.pos);
      c.k = (Math.cos(phi) + 1) / 2;
      c.group.position.copy(c.pos);
      c.group.quaternion.copy(camera.quaternion);
      c.group.rotateY(-Math.sin(phi) * .45);
      c.group.scale.setScalar(Math.max(.001, e * (.82 + .18 * c.k)));

      c.flip += (c.flipTarget - c.flip) * (1 - Math.exp(-dt * (reduce ? 30 : 5)));
      const pop = Math.sin(c.flip * Math.PI);
      c.pivot.rotation.y = c.flip * Math.PI;
      c.pivot.position.z = pop * .45;
      c.pivot.scale.setScalar(1 + pop * .06);

      c.hover += ((hovered === i ? 1 : 0) - c.hover) * (1 - Math.exp(-dt * 8));
      c.tilt.rotation.x = mouseS.y * .18 * c.hover + Math.sin(time * 1.1 + i) * .025;
      c.tilt.rotation.y = mouseS.x * .25 * c.hover;
      c.tilt.position.y = Math.sin(time * 1.4 + i * 2) * .05;

      const lum = .4 + .6 * Math.pow(c.k, 1.4);
      c.frontMat.color.setScalar(lum); c.backMat.color.setScalar(lum);
      c.glow.material.opacity = Math.pow(c.k, 3) * .55 * e + c.hover * .15;

      // beam: globe surface → card
      a.copy(c.pos).normalize().multiplyScalar(GR * 1.02);
      m.copy(a).add(c.pos).multiplyScalar(.5); m.y += .7 + .3 * c.k;
      curve.v0.copy(a); curve.v1.copy(m); curve.v2.copy(c.pos);
      for (let j = 0; j < 48; j++) { curve.getPoint(j / 47, tmp); c.beamPos.set([tmp.x, tmp.y, tmp.z], j * 3); }
      c.beam.geometry.attributes.position.needsUpdate = true;
      c.beam.material.opacity = (.12 + .5 * c.k) * e;
      const st = (time * .45 + i / 3) % 1;
      curve.getPoint(st, c.spark.position);
      c.spark.material.opacity = Math.sin(st * Math.PI) * (.3 + .7 * c.k) * e;
    });

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
